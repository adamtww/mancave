<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Space Planner</title>
<style>
:root{--accent:#2f7de1;--bad:#d6453d;--muted:#77736b;--line:#e4e2dc;--paper:#fbfaf7;--ink:#26251f;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#f3f2ee}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;background:#e0457b;border-radius:999px;padding:3px 9px}
#rname{font:inherit;font-size:15px;font-weight:600;border:1px solid transparent;border-radius:8px;padding:6px 8px;min-width:120px;max-width:260px;background:transparent;color:var(--ink)}
#rname:hover,#rname:focus{border-color:var(--line);background:#fff}
.grow{flex:1}
.btn{font-size:13.5px;padding:8px 12px;border-radius:8px;border:1px solid #d9d6ce;background:#fff;color:var(--ink);white-space:nowrap}
.btn:hover{background:#f5f4f0}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.btn.pri:hover{background:#2569c4}
.btn.red{color:#b42336;border-color:#e3b4bb}.btn:disabled{opacity:.5;cursor:default}
.who{font-size:12.5px;color:var(--muted);white-space:nowrap}.who a{color:var(--accent)}
.main{display:grid;grid-template-columns:300px 1fr 320px;gap:12px;padding:12px;min-height:0}
.pane{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pane .hd{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #f0ede6}
.pane .bd{padding:10px 12px;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:10px}
.lab{font-size:11px;font-weight:700;letter-spacing:.08em;color:#6b6960;text-transform:uppercase}
#q{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #d9d6ce;border-radius:8px;background:#fff;color:var(--ink);width:100%}
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;min-height:0;overflow:hidden}
#sv{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#26251f;color:#fff;font-size:12.5px;padding:7px 13px;border-radius:999px;white-space:nowrap;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.big{font-size:24px;font-weight:700}
.muted{font-size:12.5px;color:#6b6960;line-height:1.45;margin:0}
.dims{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center}
.dims input{font:inherit;font-size:15px;width:100%;padding:7px 8px;border:1px solid #d9d6ce;border-radius:8px;text-align:center;color:var(--ink);background:#fff}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.sw input{appearance:none;width:38px;height:22px;border-radius:11px;background:#d4d0c7;position:relative;margin:0;cursor:pointer;transition:background .15s;flex:0 0 38px}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw input:checked{background:var(--accent)}.sw input:checked::after{left:19px}
.req{display:flex;flex-direction:column;gap:2px}
.rq{display:grid;grid-template-columns:20px 1fr;gap:2px 8px;padding:7px 0;border-bottom:1px solid #f0ede6;font-size:13.5px}
.rq:last-child{border-bottom:0}.rq svg{margin-top:1px}.rq b{font-weight:600}.rq small{grid-column:2;color:#6b6960;font-size:12px;line-height:1.4}
.ol{display:flex;flex-direction:column;gap:2px}
.oi{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:1px solid transparent;font-size:13.5px;background:transparent;text-align:left;width:100%;color:var(--ink)}
.oi:hover{background:#f5f4f0}.oi.on{border-color:var(--accent);background:#eaf1fd;color:#1d4f91}
.oi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.oi .sz{font-size:12px;color:#6b6960}
.pin{font-size:11px;font-weight:700;color:#8a4a0e;background:#fcefe2;border-radius:999px;padding:2px 7px}
.irow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #f0ede6;font-size:13.5px}.irow span{color:var(--muted)}.irow b{font-weight:600;text-align:right}
.warn{font-size:12.5px;color:#7a3d0b;background:#fdf1e7;border:1px solid #f0cfae;border-radius:8px;padding:8px 10px;line-height:1.45}
.err{font-size:13px;color:#9b2c2c;background:#fdecec;border-radius:8px;padding:9px 10px;line-height:1.45;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.row{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#26251f;color:#fff;font-size:13.5px;padding:10px 16px;border-radius:10px;opacity:0;transition:all .2s;pointer-events:none;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
g.obj{transition:transform .38s cubic-bezier(.3,.9,.3,1)}g.obj.drag{transition:none}g.obj.pop{animation:spop .35s ease-out}@keyframes spop{0%{opacity:.15}100%{opacity:1}}
.lgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.lcard.mine::after{content:"Mine";position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;color:#1d4f91;background:#eaf1fd;border-radius:999px;padding:1px 6px}
.lcard{position:relative}
dialog{border:0;border-radius:14px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:min(560px,94vw);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(30,28,24,.35)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}.dlg h2{margin:0;font-size:18px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#6b6960}
.fl input,.fl select,.fl textarea{font:inherit;font-size:14px;color:var(--ink);padding:8px 9px;border:1px solid #d9d6ce;border-radius:8px;background:#fff}
.fl textarea{min-height:60px;resize:vertical}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}.ck input{width:17px;height:17px;margin:0}
.spl{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.spl button{display:flex;justify-content:space-between;gap:10px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.spl button:hover{background:#f5f4f0}.spl small{color:#6b6960}
@media (max-width:1100px){.main{grid-template-columns:250px 1fr 280px}}
.chip{position:fixed;z-index:50;pointer-events:none;background:#fff;border:1px solid #c9c4b8;border-radius:8px;padding:7px 10px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:12px;transform:translate(-50%,-60%) rotate(-3deg) scale(1.03);transition:transform .08s;white-space:nowrap}
.chip b{font-weight:600}.chip span{color:var(--muted);margin-left:6px}
body.dragging,body.dragging *{cursor:grabbing!important}
.pi.lift{background:#e7eefc}
.lib .lq{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.lib .lq input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;outline:none}
.lib .lq input:focus{border-color:var(--accent)}
.lsec{border-bottom:1px solid #f0eee9}
.lsh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:13px 6px 11px;font:inherit;font-weight:700;font-size:14px;color:#2b2a27;cursor:pointer;text-align:left}
.lsh i{width:8px;height:8px;border-radius:50%;flex:none}.lsh .lsn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsh .lct{font-weight:600;font-size:11.5px;color:#8a857a;background:#f3f1ec;border-radius:99px;padding:1px 7px}
.lsh .lchev{color:#8a857a;transition:transform .2s}.lsec.open .lchev{transform:rotate(90deg)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 2px 12px}
.lcard{aspect-ratio:1;border-radius:14px;background:#fff;border:1px solid #e6e3dc;box-shadow:0 2px 6px rgba(40,36,28,.06);display:flex;flex-direction:column;padding:8px 8px 7px;box-sizing:border-box;position:relative;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:opacity .15s,transform .15s}
.lcard:before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.lcard:hover{border-color:#cfd9ef}
.lcard .lgrip{position:absolute;top:9px;right:8px;width:6px;height:10px;background-image:radial-gradient(circle,#c4bfb3 1.1px,transparent 1.3px);background-size:3px 3.3px}
.lcard .lart{flex:1;min-height:0;padding:6px 14px 0}.lcard .lart svg{width:100%;height:100%;display:block}
.lcard .lnm{font-size:12px;font-weight:600;color:#2b2a27;line-height:1.2;max-height:2.4em;overflow:hidden;margin-top:4px}
.lcard .lnm em{font-style:normal;font-size:9.5px;font-weight:700;color:#1f4fbf;background:#eef3fd;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.lcard .lbdg{display:flex;gap:4px;margin-top:4px}.lcard .lbdg span{font-size:10.5px;font-weight:600;background:#f3f1ec;color:#6b675e;padding:2px 6px;border-radius:6px;white-space:nowrap}.lcard .lbdg .p{background:#fff4d6;color:#8a6200}
.lcard.lift{opacity:.35}
.chip.cardchip{padding:0;border:0;background:none;box-shadow:none;transition:none}
.chip.cardchip .lcard{transform:scale(1.05);border:1.5px solid #2f6fed;box-shadow:0 14px 28px rgba(40,36,28,.22);opacity:1}
body.touch .lcard{touch-action:pan-y}
.chip.cardchip{overflow:visible}
.cardchip .hang{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.cardchip .lcard{transition:transform .2s cubic-bezier(.3,1.5,.5,1),opacity .16s}
.cardchip.onc .lcard{transform:scale(.6,.12)!important;opacity:0}
.cardchip .hbox{position:absolute;left:0;top:10px;box-sizing:border-box;background:#e8e5de;border:1.5px solid #9d988c;box-shadow:0 14px 24px rgba(40,36,28,.24),0 2px 5px rgba(40,36,28,.14);display:flex;align-items:center;justify-content:center;text-align:center;color:#3d3b36;font-weight:600;line-height:1.1;padding:2px;overflow:hidden;
 opacity:0;transform:scale(.35,1.5);transform-origin:50% 0;transition:opacity .1s,transform .34s cubic-bezier(.34,1.9,.5,1),width .12s,height .12s}
.cardchip .hbox span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cardchip.onc .hbox{opacity:.95;transform:scale(1);transition-delay:.06s,.06s,0s,0s}
.cardchip .hbox.bad{border-color:var(--bad);background:#f6e3df}
.cardchip.drop .hang{transition:transform .085s ease-out}.cardchip.drop .hbox{transition:left .14s ease-in,top .14s ease-in,box-shadow .14s;box-shadow:0 1px 2px rgba(40,36,28,.2)}
.cardchip.home{transition:left .3s cubic-bezier(.3,.8,.4,1),top .3s cubic-bezier(.3,.8,.4,1),opacity .3s;opacity:.4}.cardchip.home .hang{transition:transform .2s}
.cardchip .hbox.art{background:none;border:0;box-shadow:none;padding:0;overflow:visible;filter:drop-shadow(0 12px 14px rgba(40,36,28,.28)) drop-shadow(0 2px 3px rgba(40,36,28,.16))}
.cardchip .hbox.art svg{width:100%;height:100%;display:block}
.cardchip .hbox.art.bad{background:rgba(214,69,69,.12);outline:2px solid var(--bad);outline-offset:1px;border-radius:4px}
.cardchip.drop .hbox.art{filter:drop-shadow(0 1px 1px rgba(40,36,28,.2))}
.lcard,.lcard *{-webkit-user-drag:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lcard *{touch-action:pan-y}
.cardchip .rope,.cardchip .hook{display:none}
.cardchip.tch .rope{display:block;position:absolute;left:-1px;top:9px;width:2px;height:63px;background:#6b675e;border-radius:1px;transform-origin:50% 0;transform:scaleY(0);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.cardchip.tch.onc .rope{transform:scaleY(1)}
.cardchip.tch .hook{display:block;position:absolute;left:-12px;top:-12px;width:24px;height:24px;box-sizing:border-box;border-radius:50%;border:3px solid #2f6fed;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.25);transform:scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.cardchip.tch.onc .hook{transform:scale(1)}
.cardchip.drop .rope,.cardchip.drop .hook,.cardchip.home .rope,.cardchip.home .hook{opacity:0;transition:opacity .1s}
.poof{position:fixed;z-index:45;pointer-events:none}.poof svg{position:absolute;left:0;top:0;overflow:visible}
.poof .sp{opacity:0;transform-box:fill-box;transform-origin:center;animation:smoke .56s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes smoke{0%{opacity:0;transform:scale(.4)}12%{opacity:var(--o,.8)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(var(--s1,1.6)) rotate(var(--r,0deg))}}
.dshadow{position:fixed;z-index:44;pointer-events:none;border-radius:6px;background:rgba(40,30,10,.38);filter:blur(14px);opacity:.15;transform:scale(1.35);transition:transform .155s cubic-bezier(.5,0,.9,.6),opacity .155s,filter .155s}
.dshadow.on{transform:scale(1.02);opacity:.55;filter:blur(4px)}.dshadow.off{opacity:0;transition:opacity .18s}
.cardchip.drop .hbox{transition:left .155s cubic-bezier(.5,0,.9,.6),top .155s cubic-bezier(.5,0,.9,.6),box-shadow .155s,filter .155s!important}
.lcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 4px 12px rgba(47,111,237,.18)}
.dhint{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:#6b675e;user-select:none}
.dhint .cd{flex:none;width:26px;height:26px;border-radius:6px;border:1.5px solid #e6e3dc;border-top:4px solid #b9b4a8;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.08);transform:rotate(-6deg);box-sizing:border-box}
.dhint .ar{flex:none;color:#2f6fed;font-size:16px;letter-spacing:-2px;white-space:nowrap}
.dhint .rm{flex:none;width:34px;height:24px;border:2px solid #2b2a27;border-radius:3px;background:#faf9f6;position:relative;box-sizing:border-box}
.dhint .rm:after{content:'';position:absolute;right:4px;bottom:3px;width:9px;height:8px;border:1.5px dashed #3f8a4f;border-radius:2px;background:rgba(63,138,79,.15)}
.lcard .lbdg .rz{background:#eef3fd!important;color:#2f6fed!important}
</style>

<body>
<div class="app">
 <div class="top">
  <h1>Space Planner</h1><span class="tag" id="tag">TEST</span>
  <input id="rname" value="Untitled room" aria-label="Room name" autocomplete="off">
  <span class="grow"></span>
  <span class="who" id="who"></span>
  <button class="btn" id="b-new">New room</button>
  <button class="btn" id="b-open">Open…</button>
  <button class="btn pri" id="b-save">Save</button>
 </div>
 <div class="main">
  <aside class="pane lib" aria-label="Objects">
   <div class="hd"><div class="row" style="align-items:center;justify-content:space-between"><span class="lab">Add objects</span><button class="btn" id="b-newobj" style="padding:5px 10px;font-size:12.5px">+ New object</button></div>
    <input id="q" type="search" placeholder="Search objects…" autocomplete="off"><p class="muted">Click an object to add it. It finds its own spot.</p></div>
   <div class="bd" id="lib"></div>
  </aside>
  <div class="stage"><svg id="sv" aria-label="Room plan"></svg><div class="hint" id="hint">Click objects on the left to add them · drag one to pin it where you want</div></div>
  <aside class="pane" aria-label="Room details"><div class="bd" id="side"></div></aside>
 </div>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="d-obj"></dialog>
<dialog id="d-open"></dialog>
<script>
var CATS=[
 ["Rooms & Zones","#8a8fa8"],["Building & Support","#7c8098"],["Built-ins & Counters","#8d7b68"],["Arcade & Gaming","#b14bff"],["Bar & Lounge","#ff8a3d"],["Furniture & Seating","#a07a5a"],
 ["Kitchen – Residential","#ffd166"],["Kitchen – Commercial","#ffb000"],["Fitness","#3ddc97"],["Court & Rink","#34c3ff"],
 ["Creator / Maker","#ff4fa3"],["Woodworking","#c9a26b"],["Indoor Garden","#7bd389"],["Wishlist","#d0d0e0"]];
var CATCOLOR={};CATS.forEach(function(c){CATCOLOR[c[0]]=c[1]});
var ALERTS={
 truck:["Truck parked inside","A space where vehicles park is usually classed as Group S-2 (parking) under the California Building Code, which can mean a fire-rated wall between it and other uses, plus other fire-code steps. The city/fire marshal decides. Look for units that already have a grade-level roll-up door, ask the broker/city early whether parking inside is allowed, and keep the bay away from welding and lasers."],
 plumbing:["New plumbing","Showers and added bathrooms need drain lines — often means cutting the concrete slab. Good item to ask the landlord to build as a lease concession."],
 weld:["Laser welder","Needs its own 240V circuit installed by a licensed electrician, a well-ventilated room, and argon or nitrogen shielding gas (bought separately). It's a Class 4 laser: wall it off or use laser curtains so nobody gets eye exposure. Keep it away from the truck bay and flammables."],
 co2:["Laser cutter fumes","CO2 laser cutters need fume exhaust ducted outside (or a filter unit). Put it on an exterior wall and ask the landlord about wall/roof penetrations."],
 gas:["Compressed gas","Argon/nitrogen cylinders must be chained upright, away from heat. The fire marshal may ask how much compressed gas is stored."],
 commercial:["Commercial kitchen equipment = inspections","Commercial cooking gear generally needs a Type I exhaust hood with fire suppression and city/fire inspections. If food is ever sold or served to the public, an Orange County Health Care Agency food-facility permit too. Residential appliances avoid most of this (matches what his AI said)."],
 public:["Classes = public use","Teaching classes means members of the public on site, which can change the building's occupancy (exits, restrooms, accessibility, sprinklers). Confirm with the city before signing if classes are likely."],
 ceiling:["Ceiling height","Ask every listing for 'clear height'. A 10 ft rim with real shooting arc wants roughly 18–20 ft clear; batting and tennis need ~12 ft+."],
 garden:["Water & humidity","Hydroponics needs a water source and floor drain nearby and adds humidity — keep it away from electronics and the shop."],
 dust:["Wood dust","Run a dust collector and keep the woodshop separated (wall or curtain) from the arcade, sims and lounge so dust stays out of electronics."],
 hvac:["Cooling","He wants it not hot. Many warehouses only heat (or use evaporative coolers) in the open area. Cooling 10k sq ft is a large electrical load — a prime concession to ask for, and something to verify on every tour."],
 notyet:["Not released yet","Not available yet — dimensions and power are placeholders."]
};
/* p: [volts, watts, breakerAmps, dedicated(1/0)] ; est: estimate flag ; ov: may overlap others ; z: zone */

 // Building & Support

 $('#lib').innerHTML=h||'<p class="muted">No objects match.</p>';
 $('#lib').querySelectorAll('.lsh').forEach(function(b){b.onclick=function(){openCats[b.dataset.c]=!openCats[b.dataset.c];renderLib()}});
 $('#lib').querySelectorAll('.lcard').forEach(function(b){b.onclick=function(){add(b.dataset.r)};b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();add(b.dataset.r)}};b.oncontextmenu=function(e){e.preventDefault();editObj(b.dataset.r)}});markLib()}

$('#q').oninput=function(){q=this.value;renderLib()};

/* ---------------- right: room, requirements, objects ---------------- */
var ICO={power:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',water:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',vent:'<path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/>',gas:'<rect x="8" y="6" width="8" height="15" rx="3"/><path d="M10 3h4v3h-4z"/>',ceil:'<path d="M4 4h16M12 7v13M9 10l3-3 3 3M9 17l3 3 3-3"/>',cool:'<path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1 19.1 4.9"/>',note:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>'};
function ico(k){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f5b52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICO[k]+'</svg>'}
function power(list){var o={w:0,max:0,items:0,est:0,ded:{},sh:{}};list.forEach(function(it){var c=defOf(it);if(!c||!c.p)return;var V=c.p[0],W=c.p[1],A=c.p[2];o.items++;o.w+=W;o.max=Math.max(o.max,W);if(c.est)o.est++;if(c.p[3]){var k=V+'|'+A;(o.ded[k]=o.ded[k]||{V:V,A:A,n:0}).n++}else{(o.sh[V]=o.sh[V]||{V:V,w:0}).w+=W}});
 o.circ=[];Object.keys(o.ded).forEach(function(k){var d=o.ded[k];o.circ.push(d.n+' × '+d.V+'V '+d.A+'A dedicated')});Object.keys(o.sh).forEach(function(k){var g=o.sh[k],n=Math.max(1,Math.ceil(g.w/(g.V*20*.8)));o.circ.push(n+' × '+g.V+'V 20A shared')});o.peak=o.items?o.max+(o.w-o.max)*.5:0;return o}
function reqHtml(){var L=P.items.map(function(it){return {it:it,c:defOf(it)}}).filter(function(x){return x.c}),names=function(f){var s={};L.forEach(function(x){if(f(x))s[x.c.n]=(s[x.c.n]||0)+1});return Object.keys(s).map(function(n){return s[n]>1?n+' ×'+s[n]:n}).join(', ')};
 if(!L.length)return '<p class="muted">Add objects and the room\'s needs show up here: power, plumbing, ventilation and more.</p>';
 var h='',pw=power(P.items);
 h+='<div class="rq">'+ico('power')+'<div><b>Power</b> · '+(pw.items?(pw.est?'≈ ':'')+fmtW(pw.w)+' connected, ≈ '+fmtW(pw.peak)+' peak':'none')+'</div>'+(pw.circ.length?'<small>'+esc(pw.circ.join(' · '))+'</small>':'')+'</div>';
 var w=names(function(x){return needs(x.c).water});if(w)h+='<div class="rq">'+ico('water')+'<div><b>Plumbing</b> · water and drain</div><small>'+esc(w)+'</small></div>';
 var vv={};L.forEach(function(x){var n=needs(x.c);if(n.vent)(vv[n.vent]=vv[n.vent]||[]).push(x.c.n)});Object.keys(vv).forEach(function(k){h+='<div class="rq">'+ico('vent')+'<div><b>Ventilation</b> · '+esc(k)+'</div><small>'+esc(Array.from(new Set(vv[k])).join(', '))+'</small></div>'});
 var g=names(function(x){return needs(x.c).gas});if(g)h+='<div class="rq">'+ico('gas')+'<div><b>Compressed gas storage</b></div><small>'+esc(g)+'</small></div>';
 var ce=0,ceq=names(function(x){var n=needs(x.c);if(n.ceil>0)ce=Math.max(ce,n.ceil);return !!n.ceil});if(ceq)h+='<div class="rq">'+ico('ceil')+'<div><b>Ceiling height</b> · '+(ce?'at least '+fmt(ce)+' ft clear':'check clear height')+'</div><small>'+esc(ceq)+'</small></div>';
 var co=names(function(x){return needs(x.c).cool});if(co)h+='<div class="rq">'+ico('cool')+'<div><b>Cooling</b></div><small>'+esc(co)+'</small></div>';
 var ot={};L.forEach(function(x){needs(x.c).other.forEach(function(k){if(ALERTS[k])(ot[k]=ot[k]||[]).push(x.c.n)})});Object.keys(ot).forEach(function(k){h+='<div class="rq">'+ico('note')+'<div><b>'+esc(ALERTS[k][0])+'</b></div><small>'+esc(Array.from(new Set(ot[k])).join(', '))+'</small></div>'});
 return h}
function side(){var W=P.room.w,D=P.room.d,h='';
 h+='<div class="card"><span class="lab">Room</span><div class="big">'+Math.round(W*D).toLocaleString()+' sq ft</div><div class="dims"><input id="r-w" value="'+fmt(W)+'" inputmode="decimal" aria-label="Width in feet"><span>×</span><input id="r-d" value="'+fmt(D)+'" inputmode="decimal" aria-label="Depth in feet"><button class="btn" id="r-set">Set</button></div>';
 h+='<label class="sw"><input type="checkbox" id="r-dyn"'+(P.dyn?' checked':'')+'> Dynamic Expansion</label><p class="muted">'+(P.dyn?'The room grows to fit new objects. It never shrinks on its own.':'The room stays this size. Objects that don\'t fit are refused.')+'</p>';
 if(lastFail&&lastFail.msg)h+='<div class="err"><span>'+esc(lastFail.msg)+'.</span><button class="btn" id="r-grow">Make room bigger and add it</button></div>';
 h+='</div>';
 var it=byU(sel);if(it){var c=defOf(it),m=dims(it,it.rot);h+='<div class="card"><span class="lab">Selected</span><b style="font-size:15px">'+esc(c.n)+'</b>'+(it.pin?'<span class="pin" style="align-self:flex-start">Pinned here</span>':'')+
  '<div class="irow"><span>Size</span><b>'+fmt(m.w)+' × '+fmt(m.d)+' ft</b></div><div class="irow"><span>Clearance</span><b>'+(c.cl?fmt(c.cl)+' ft '+(c.cf?'in front':'all around'):'none')+'</b></div>'+(c.p?'<div class="irow"><span>Power</span><b>'+c.p[0]+'V · '+fmtW(c.p[1])+(c.p[3]?' · own circuit':'')+'</b></div>':'')+(c.no?'<p class="muted">'+esc(c.no)+'</p>':'')+
  '<div class="row"><button class="btn" id="o-rl" title="Turn left (Shift+R)">↺ Turn left</button><button class="btn" id="o-rr" title="Turn right (R)">↻ Turn right</button></div><div class="row"><button class="btn" id="o-pin">'+(it.pin?'Unpin':'Pin here')+'</button><button class="btn red" id="o-del">Remove</button></div></div>'}
 h+='<div class="card"><span class="lab">This room needs</span><div class="req">'+reqHtml()+'</div></div>';
 if(P.items.length){var cnt={};h+='<div class="card"><span class="lab">In this room · '+P.items.length+'</span><div class="ol">'+P.items.map(function(i){var c=defOf(i),m=dims(i,i.rot);return '<button class="oi'+(sel===i.u?' on':'')+'" data-u="'+i.u+'"><span class="nm">'+esc(c.n)+'</span>'+(i.pin?'<span class="pin">pinned</span>':'')+'<span class="sz">'+fmt(m.w)+'×'+fmt(m.d)+'</span></button>'}).join('')+'</div></div>'}
 var S=$('#side');S.innerHTML=h;
 $('#r-set').onclick=function(){setSize(parseFloat($('#r-w').value),parseFloat($('#r-d').value))};['#r-w','#r-d'].forEach(function(s){$(s).onkeydown=function(e){if(e.key==='Enter')$('#r-set').click()}});
 $('#r-dyn').onchange=function(){push();P.dyn=this.checked;persist();render()};
 var gb=$('#r-grow');if(gb)gb.onclick=function(){var r=lastFail.r,c=LIB[r],before=snapP(),nit={u:'o'+(P.uid++),r:r,x:0,y:0,rot:0,n:P.uid};P.defs[r]=JSON.parse(JSON.stringify(c));P.items.push(nit);if(!relayout({force:true})){P=JSON.parse(before);toast('Even a much bigger room can\'t fit that');render();return}hist.push(before);fut=[];sel=nit.u;lastFail=null;persist();render()};
 if(it){$('#o-rl').onclick=function(){rotate(it.u,-1)};$('#o-rr').onclick=function(){rotate(it.u,1)};$('#o-pin').onclick=function(){setPin(it.u,!it.pin)};$('#o-del').onclick=function(){remove(it.u)}}
 S.querySelectorAll('.oi').forEach(function(b){b.onclick=function(){sel=b.dataset.u;render()}})}

/* ---------------- objects: make your own; the admin edits the shared library ---------------- */
function editObj(r){var c=r?LIB[r]:null,mine=!!(r&&MINE[r]),admin=!!(me&&me.admin);if(!tok){toast('Sign in to the test app to make your own objects');return}
 var canEdit=!c||mine||admin,shared=c&&!mine,d=$('#d-obj'),cs=CATS.filter(function(x){return x[0]!=='Rooms & Zones'}).map(function(x){return x[0]});
 var n=c?needs(c):{},p=c&&c.p?c.p:[0,0,20,0],title=!c?'New object':shared?(admin?'Edit shared object':'Object details'):'Edit my object';
 d.innerHTML='<form method="dialog" class="dlg"><h2>'+title+'</h2>'+(shared&&!admin?'<p class="muted">Shared objects are managed by the library owner. Save a copy to make your own version.</p>':'')+
  '<div class="fg"><label class="fl" style="grid-column:1/-1">Name<input name="n" required value="'+esc(c?c.n:'')+'"></label>'+
  '<label class="fl">Category<select name="c">'+cs.map(function(x){return '<option'+(c&&c.c===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></label><span></span>'+
  '<label class="fl">Width (ft)<input name="w" inputmode="decimal" required value="'+(c?c.w:'')+'"></label><label class="fl">Depth (ft)<input name="d" inputmode="decimal" required value="'+(c?c.d:'')+'"></label>'+
  '<label class="fl">Clearance (ft)<input name="cl" inputmode="decimal" value="'+(c&&c.cl?c.cl:0)+'"></label><label class="fl">Clearance is<select name="cf"><option value="0">all around</option><option value="1"'+(c&&c.cf?' selected':'')+'>in front only (backs to a wall)</option></select></label>'+
  '<label class="fl">Power<select name="pv"><option value="0">none</option><option value="120"'+(p[0]===120?' selected':'')+'>120V</option><option value="240"'+(p[0]>=208?' selected':'')+'>240V</option></select></label><label class="fl">Watts<input name="pw" inputmode="decimal" value="'+(p[1]||'')+'"></label>'+
  '<label class="ck"><input type="checkbox" name="pd"'+(p[3]?' checked':'')+'> Needs its own circuit</label><span></span>'+
  '<label class="ck"><input type="checkbox" name="water"'+(n.water?' checked':'')+'> Needs plumbing</label><label class="ck"><input type="checkbox" name="vent"'+(n.vent?' checked':'')+'> Needs ventilation</label>'+
  '<label class="ck"><input type="checkbox" name="gas"'+(n.gas?' checked':'')+'> Uses compressed gas</label><label class="fl">Min. ceiling height (ft)<input name="ceil" inputmode="decimal" value="'+(n.ceil>0?n.ceil:'')+'"></label>'+
  '<label class="fl" style="grid-column:1/-1">Notes<textarea name="no">'+esc(c&&c.no||'')+'</textarea></label></div>'+(!c&&admin?'<label class="ck" style="margin-top:10px"><input type="checkbox" name="sh" checked> Add to the shared library (everyone sees it)</label>':'')+
  '<div class="row" style="justify-content:space-between"><span class="row">'+(c&&canEdit?'<button class="btn red" value="del">'+(shared?'Remove from library':'Delete')+'</button>':'')+'</span><span class="row"><button class="btn" value="cancel">Cancel</button>'+(shared?'<button class="btn" value="copy">Save as my own copy</button>':'')+(canEdit?'<button class="btn pri" value="save">Save</button>':'')+'</span></div></form>';
 if(shared&&!admin)Array.prototype.forEach.call(d.querySelectorAll('input,select,textarea'),function(el){if(el.name)el.dataset.ro=1});
 d.onclose=function(){var v=d.returnValue,f=d.querySelector('form');if(v==='cancel'||!v)return;
  if(v==='del'){if(!confirm((shared?'Remove '+c.n+' from the shared library for everyone?':'Delete '+c.n+'?')))return;api('DELETE','/api/objects/'+r).then(function(){toast(c.n+' removed');return loadLib()}).then(renderLib).catch(function(e){toast(e.message)});return}
  var F=function(k){return f.elements[k]},num=function(k){return parseFloat(F(k).value)||0},nd={n:F('n').value.trim(),c:F('c').value,w:num('w'),d:num('d'),cl:num('cl')};if(F('cf').value==='1')nd.cf=1;
  var pv=+F('pv').value;if(pv)nd.p=[pv===240?240:120,num('pw'),pv===240?30:20,F('pd').checked?1:0];nd.req={water:F('water').checked,vent:F('vent').checked,gas:F('gas').checked,ceil:num('ceil')};if(F('no').value.trim())nd.no=F('no').value.trim();
  if(c&&c.a)nd.a=c.a.slice();if(c&&c.est)nd.est=c.est;if(!nd.n||!(nd.w>0&&nd.d>0)){toast('An object needs a name, width and depth');return}
  var slug=nd.n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)+'-'+Date.now().toString(36).slice(-4),toShared=!c&&admin&&f.elements.sh&&f.elements.sh.checked;
  var key=toShared?'s-'+slug:(v==='copy'||!c)?'u'+me.id+'-'+slug:r;
  api('PUT','/api/objects/'+key,{data:nd}).then(function(){toast((toShared?'Added to the shared library':v==='copy'?'Copy saved to My objects':'Saved')+': '+nd.n);return loadLib()}).then(function(){P.items.forEach(function(i){if(i.r===key)P.defs[key]=JSON.parse(JSON.stringify(LIB[key]))});if(toShared)openCats[nd.c]=true;else if(!c||v==='copy')openCats['My objects']=true;renderLib();relayout();render()}).catch(function(e){toast(e.message)})};
 d.showModal()}
$('#b-newobj').onclick=function(){editObj(null)};

/* ---------------- saving rooms ---------------- */
function pack(){var defs={};P.items.forEach(function(i){var c=defOf(i);if(c)defs[i.r]=c});return {room:P.room,dyn:P.dyn,uid:P.uid,items:P.items.map(function(i){return {u:i.u,r:i.r,x:i.x,y:i.y,rot:i.rot,pin:!!i.pin,n:i.n}}),defs:defs}}
$('#rname').onchange=function(){P.name=this.value.trim()||'Untitled room';persist()};
$('#b-save').onclick=function(){if(!tok){toast('Sign in to the test app first to save rooms to your account');return}P.name=$('#rname').value.trim()||'Untitled room';var b={name:P.name,data:pack()};
 (P.id?api('PUT','/api/spaces/'+P.id,b):api('POST','/api/spaces',b).then(function(j){P.id=j.id})).then(function(){persist();toast('Saved “'+P.name+'”')}).catch(function(e){toast(e.message)})};
$('#b-new').onclick=function(){push();P=blank();sel=null;lastFail=null;persist();render()};
$('#b-open').onclick=function(){if(!tok){toast('Sign in to the test app first to open saved rooms');return}api('GET','/api/spaces').then(function(j){var d=$('#d-open');
 d.innerHTML='<form method="dialog" class="dlg"><h2>Open a room</h2>'+(j.spaces.length?'<div class="spl">'+j.spaces.map(function(s){return '<button value="'+s.id+'"><span>'+esc(s.name)+'</span><small>'+esc(s.updated_at.slice(0,16))+'</small></button>'}).join('')+'</div>':'<p class="muted">No saved rooms yet.</p>')+'<div class="row" style="justify-content:flex-end"><button class="btn" value="">Close</button></div></form>';
 d.onclose=function(){var id=d.returnValue;if(!id)return;api('GET','/api/spaces/'+id).then(function(r){push();var x=r.space.data;P=Object.assign(blank(),{id:r.space.id,name:r.space.name,room:x.room,dyn:x.dyn!==false,uid:x.uid||1,items:x.items||[],defs:x.defs||{}});sel=null;lastFail=null;persist();render();toast('Opened “'+P.name+'”')}).catch(function(e){toast(e.message)})};d.showModal()}).catch(function(e){toast(e.message)})};
function showWho(){$('#who').innerHTML=me?'Signed in as <b>'+esc(me.username)+'</b>'+(me.admin?' · library owner':''):'Not signed in · <a href="index.html">sign in to the test app</a> to save'}
showWho();
if(tok)api('GET','/api/me').then(function(j){me=j.user;showWho();return loadLib()}).then(function(){renderLib();render()}).catch(function(){tok=null;me=null;showWho()});
renderLib();render();
window.__sp={P:function(){return P},layout:layout,add:add,setSize:setSize,lib:function(){return LIB},sel:function(){return sel},undo:undo};
})();
