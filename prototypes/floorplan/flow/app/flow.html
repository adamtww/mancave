<!--CSS-->
<style>
/* ---------- new-layout flow (start options, upload, loading) ---------- */
.nf-mdl{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(30,29,26,.32);font-family:Inter,system-ui,sans-serif}
.nf-mdl.show{display:flex}
.nf-box{background:#fff;border-radius:18px;width:min(620px,92vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.25);animation:nfIn .14s ease-out;overflow:hidden;color:#2b2a27}
@keyframes nfIn{from{transform:translateY(6px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.nf-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px 22px;border-bottom:1px solid #dedbd3;font-size:17px;font-weight:700}
.nf-h .nf-tl{display:flex;align-items:center}
.nf-x{border:0;background:#f4f2ed;width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:#55524b}
.nf-back{border:0;background:#f4f2ed;height:32px;border-radius:999px;padding:0 12px 0 8px;font-size:13.5px;cursor:pointer;color:#55524b;display:flex;align-items:center;gap:4px;margin-right:10px}
.nf-b{overflow:auto;padding:16px 22px 22px}
.nf-lead{margin:0 0 14px;font-size:14px;color:#5c5950}
.nf-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.nf-choices{grid-template-columns:1fr}}
.nf-ch{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:#fff;border:1.5px solid #dedbd3;border-radius:14px;padding:18px 16px 16px;cursor:pointer;color:#2b2a27;font:inherit;transition:border-color .12s,box-shadow .12s}
.nf-ch:hover,.nf-ch:focus-visible{border-color:#2f6fed;box-shadow:0 6px 18px rgba(47,111,237,.12);outline:none}
.nf-ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#eef3fd;color:#2f6fed}
.nf-ch.scratch .nf-ic{background:#f2f0ea;color:#3a3935}
.nf-ct{font-size:16px;font-weight:700}
.nf-cd{font-size:13px;line-height:1.45;color:#6b675e}
.nf-tag{font-size:11.5px;font-weight:600;color:#2f6fed;background:#eef3fd;border-radius:999px;padding:3px 8px}
.nf-ch.scratch .nf-tag{color:#5c5950;background:#f2f0ea}
.nf-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;align-items:center}
.nf-btn{border:1px solid #dedbd3;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;color:#3d3b36;white-space:nowrap;font-family:inherit}
.nf-btn:hover{background:#f4f2ed}
.nf-btn.pri{background:#2f6fed;border-color:#2f6fed;color:#fff;font-weight:600}
.nf-btn.pri:hover{background:#2763d6}
.nf-btn[disabled]{opacity:.45;cursor:default}
.nf-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;border:2px dashed #cfcac0;border-radius:14px;padding:34px 18px;background:#fbfaf7;cursor:pointer;transition:border-color .12s,background .12s}
.nf-drop:hover,.nf-drop:focus-visible{border-color:#2f6fed;outline:none}
.nf-drop.over{border-color:#2f6fed;background:#eef3fd}
.nf-dt{font-size:16px;font-weight:700}
.nf-ds{font-size:13px;color:#6b675e}
.nf-file{display:none;align-items:center;gap:12px;border:1.5px solid #dedbd3;border-radius:14px;padding:12px}
.nf-file.show{display:flex}
.nf-th{width:64px;height:64px;border-radius:10px;background:#f2f0ea center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:#8a867c;font-size:12px;font-weight:700}
.nf-fn{font-size:14.5px;font-weight:600;word-break:break-all}
.nf-fs{font-size:12.5px;color:#6b675e;margin-top:2px}
.nf-fx{margin-left:auto;border:0;background:none;color:#8a867c;font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit}
.nf-err{display:none;margin-top:10px;font-size:13px;color:#b3412f;background:#fbeeeb;border-radius:10px;padding:8px 10px;line-height:1.45}
.nf-err.show{display:block}
.nf-note{font-size:12.5px;color:#8a867c;margin-top:12px}
/* loading card */
.nf-load{width:min(660px,94vw)}
.nf-lrow{display:flex;gap:20px;padding:22px}
@media (max-width:620px){.nf-lrow{flex-direction:column}}
.nf-thumb{width:200px;height:260px;flex:none;border-radius:12px;border:1px solid #dedbd3;background:#fff;position:relative;overflow:hidden}
.nf-thumb .pg{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}
.nf-thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a29e94;font-size:13px}
.nf-thumb::after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(180deg,transparent,rgba(47,111,237,.16),transparent);animation:nfScan 2.2s linear infinite}
.nf-load.done .nf-thumb::after,.nf-load.fail .nf-thumb::after{display:none}
@keyframes nfScan{to{top:100%}}
.nf-lt{font-size:18px;font-weight:700;margin:2px 0 4px}
.nf-ls{font-size:13px;color:#6b675e;margin-bottom:14px;word-break:break-all}
.nf-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.nf-steps li{display:flex;align-items:center;gap:10px;font-size:14px;color:#a29e94}
.nf-steps li .dot{width:20px;height:20px;border-radius:50%;border:2px solid #dcd8cf;flex:none;display:flex;align-items:center;justify-content:center}
.nf-steps li.now{color:#2b2a27;font-weight:600}
.nf-steps li.now .dot{border-color:#2f6fed;border-right-color:transparent;animation:nfSpin .8s linear infinite}
.nf-steps li.ok{color:#5c5950}
.nf-steps li.ok .dot{border-color:#1f9d55;background:#1f9d55}
.nf-steps li.ok .dot::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.nf-steps li.skip{display:none}
.nf-steps small{font-weight:400;color:#a29e94}
@keyframes nfSpin{to{transform:rotate(360deg)}}
.nf-pbar{height:6px;border-radius:99px;background:#ece9e2;overflow:hidden;flex:1}
.nf-pbar i{display:block;height:100%;width:0;background:#2f6fed;border-radius:99px;transition:width .5s ease}
.nf-load.fail .nf-pbar i{background:#d64545}
.nf-time{font-size:12.5px;color:#8a867c;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.nf-done{display:none;font-weight:700;color:#1f7a45;font-size:14px;margin-right:auto}
.nf-load.done .nf-done{display:block}
.nf-new{white-space:nowrap}
/* on/off settings are toggle switches, drawn by the page (so dark mode can't grey them out), switch on the left */
#left input[type=checkbox]{-webkit-appearance:none;appearance:none;position:relative;width:38px;height:22px;margin:0;flex:none;border:0;border-radius:99px;background:#d6d2c8;cursor:pointer;vertical-align:middle;transition:background .15s}
#left input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:left .15s}
#left input[type=checkbox]:checked{background:#2f6fed}
#left input[type=checkbox]:checked::after{left:19px}
#left input[type=checkbox]:focus-visible{outline:2px solid #2f6fed;outline-offset:2px}
#left label.opt{gap:10px;align-items:center;padding:3px 0}
/* ---- layout D panels ---- */
.app{grid-template-columns:230px 1fr 280px!important}
.nf-grp{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.nf-h2{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b675e;margin:0 0 2px}
#left .nf-t{display:flex;align-items:center;gap:10px;width:100%;border:1px solid #e6e2da;background:#fff;border-radius:10px;padding:9px 10px;font-size:14px;color:#3d3b36;cursor:pointer;text-align:left;font-family:inherit}
#left .nf-t:hover{background:#f7f6f2}
#left .nf-t.on{background:#eef3fd;border-color:#2f6fed;color:#1d4fb8;font-weight:600}
.nf-view{border-top:1px solid #eeebe4;padding-top:12px;margin-top:4px}
.nf-card{background:#f6f4ef;border-radius:12px;padding:12px 14px}
.nf-big #a-use{font-size:28px;font-weight:700;line-height:1.15}
.nf-sub{font-size:12.5px;color:#6b675e;margin-bottom:8px}
.nf-card .row{border-color:#e6e2d9}
.nf-rs{border:0!important;padding:0!important;display:flex!important;gap:6px!important;align-items:center}
.nf-rs input{flex:1;min-width:0;width:auto!important}
.nf-rs span{font-size:13px;color:#6b675e}
.nf-more{margin-top:8px}
.nf-ctx{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.nf-p{font-size:13px;color:#6b675e;margin:0;line-height:1.5}
.nf-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.nf-seg .tool{text-align:center;font-size:13.5px;padding:8px}
.nf-ctx #dooropt,.nf-ctx #colopt{gap:8px;align-items:center;font-size:13.5px;margin:0}
.nf-tips{font-size:12.5px!important;margin:0!important;border-top:1px solid #eeebe4;padding-top:10px}
/* importing is done by the new-layout flow, so the panel's own floor-plan section is hidden (its controls still drive the reader) */
#ai-box{display:none!important}
</style>
<!--HTML-->
<div class="nf-mdl" id="nf-start"><div class="nf-box" role="dialog" aria-modal="true" aria-labelledby="nf-st">
  <div class="nf-h"><span id="nf-st">New layout</span><button class="nf-x" data-close aria-label="Close">×</button></div>
  <div class="nf-b">
    <p class="nf-lead">How do you want to start?</p>
    <div class="nf-choices">
      <button class="nf-ch" id="nf-c-plan">
        <span class="nf-ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 18v-6M9 15l3-3 3 3"/></svg></span>
        <span class="nf-ct">Upload a floor plan</span>
        <span class="nf-cd">Drop in a PDF or picture of the plan, like a listing flyer. Claude reads it and builds the outline, walls, doors and rooms for you to check.</span>
        <span class="nf-tag">PDF, PNG or JPG</span>
      </button>
      <button class="nf-ch scratch" id="nf-c-scratch">
        <span class="nf-ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V8l6-4h10v16z"/><path d="M4 20h16"/><circle cx="4" cy="8" r="1.6" fill="currentColor"/><circle cx="10" cy="4" r="1.6" fill="currentColor"/></svg></span>
        <span class="nf-ct">Create from scratch</span>
        <span class="nf-cd">Start with a plain rectangle at the size you enter, then shape it yourself: add corners, curve walls, and black out space you can't use.</span>
        <span class="nf-tag">Width × depth in feet</span>
      </button>
    </div>
    <div class="nf-foot"><button class="nf-btn" data-close>Cancel</button></div>
  </div>
</div></div>

<div class="nf-mdl" id="nf-up"><div class="nf-box" role="dialog" aria-modal="true" aria-labelledby="nf-ut">
  <div class="nf-h"><span class="nf-tl"><button class="nf-back" id="nf-up-back" aria-label="Back to the start options"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Back</button><span id="nf-ut">Upload a floor plan</span></span><button class="nf-x" data-close aria-label="Close">×</button></div>
  <div class="nf-b">
    <div class="nf-drop" id="nf-drop" tabindex="0" role="button" aria-label="Choose a floor plan file, or drop one here">
      <span class="nf-ic" style="width:52px;height:52px"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
      <span class="nf-dt">Drag and drop your floor plan here</span>
      <span class="nf-ds">or</span>
      <button class="nf-btn pri" id="nf-browse" type="button">Browse files</button>
      <span class="nf-ds">PDF, PNG or JPG · up to 20 MB</span>
    </div>
    <input type="file" id="nf-in" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" hidden>
    <div class="nf-file" id="nf-file"><div class="nf-th" id="nf-th"></div><div style="min-width:0"><div class="nf-fn" id="nf-fn"></div><div class="nf-fs" id="nf-fs"></div></div><button class="nf-fx" id="nf-fx">Choose another</button></div>
    <div class="nf-err" id="nf-uerr"></div>
    <div class="nf-note">A listing flyer works fine: Claude finds the plan on the page and reads the size printed on it.</div>
    <div class="nf-foot"><button class="nf-btn" data-close>Cancel</button><button class="nf-btn pri" id="nf-go" disabled>Continue</button></div>
  </div>
</div></div>

<div class="nf-mdl" id="nf-ld"><div class="nf-box nf-load" id="nf-card" role="dialog" aria-modal="true" aria-labelledby="nf-lt">
  <div class="nf-lrow">
    <div class="nf-thumb" id="nf-thumb" aria-hidden="true"><div class="ph" id="nf-ph">Opening…</div></div>
    <div style="flex:1;min-width:0">
      <div class="nf-lt" id="nf-lt">Building your layout</div>
      <div class="nf-ls" id="nf-ls"></div>
      <ul class="nf-steps" id="nf-steps"></ul>
      <div class="nf-err" id="nf-lerr"></div>
      <div class="nf-foot" style="justify-content:stretch"><div class="nf-pbar"><i id="nf-p"></i></div><span class="nf-time" id="nf-t">0 s</span></div>
      <div class="nf-foot"><span class="nf-done">Done, opening the editor…</span><button class="nf-btn" id="nf-again" style="display:none">Try another file</button><button class="nf-btn" id="nf-cancel">Cancel</button></div>
    </div>
  </div>
</div></div>
<!--JS-->
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var start=$('#nf-start'),up=$('#nf-up'),ld=$('#nf-ld');
function show(m){[start,up,ld].forEach(function(x){x.classList.toggle('show',x===m)})}
function hideAll(){show(null)}
document.querySelectorAll('#nf-start [data-close],#nf-up [data-close]').forEach(function(b){b.onclick=hideAll});
[start,up].forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)hideAll()})});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(start.classList.contains('show')||up.classList.contains('show')))hideAll()});
function openStart(){show(start);setTimeout(function(){$('#nf-c-plan').focus()},30)}

// ---- panels (layout D): tools on the left; on the right a pinned "This space" card, then whatever the tool or selection needs ----
(function(){
 function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
 var g=function(id){return document.getElementById(id)};
 var left=g('w0').closest('.pane'),right=g('a-use').closest('.pane');
 // keep everything the editor's code needs, but out of sight
 var park=el('div');park.style.display='none';document.body.appendChild(park);
 var keep={};['ai-box','w0','start','mkround','sample','clr'].forEach(function(id){keep[id]=g(id)});
 var tw=g('ai-tracewrap'),sa=g('snapang').closest('label'),sg=g('snapgrid').closest('label');
 var tSel=left.querySelector('.tool[data-t="select"]'),tDraw=left.querySelector('.tool[data-t="draw"]'),tWall=left.querySelector('.tool[data-t="iwall"]'),tDoor=left.querySelector('.tool[data-t="door"]');
 var bks=[].slice.call(left.querySelectorAll('.tool.bk')),dopt=g('dooropt'),copt=g('colopt'),tips=[].slice.call(left.children).filter(function(c){return /Shape it yourself/.test(c.textContent)})[0];
 var ICON={select:'<path d="M5 3l14 8-6 2-2 6z"/>',draw:'<path d="M4 20V6l5-3h11v17z"/>',iwall:'<path d="M3 12h18"/><path d="M3 7h18M3 17h18" opacity=".35"/>',door:'<path d="M4 20h6V4"/><path d="M10 4a16 16 0 0 1 10 16"/>',blk:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12l8-8M8 20L20 8M14 20l6-6"/>'};
 function ic(k){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>'}
 function relabel(b,k,txt){b.innerHTML=ic(k)+'<span>'+txt+'</span>';b.classList.add('nf-t')}
 relabel(tSel,'select','Select / edit');relabel(tDraw,'draw','Outline');relabel(tWall,'iwall','Interior wall');relabel(tDoor,'door','Door');
 // one Blackout tool on the left; its shapes are picked on the right
 var bkBtn=el('button','nf-t nf-bk',ic('blk')+'<span>Blackout</span>'),lastBk=bks[0];
 bkBtn.onclick=function(){(lastBk||bks[0]).click()};
 bks.forEach(function(b){b.addEventListener('click',function(){lastBk=b})});
 // rebuild the left panel
 [].slice.call(left.children).forEach(function(c){park.appendChild(c)});
 function grp(title,items){var d=el('div','nf-grp');d.appendChild(el('div','nf-h2',title));items.forEach(function(i){d.appendChild(i)});return d}
 left.appendChild(grp('Select',[tSel]));left.appendChild(grp('Walls',[tDraw,tWall]));left.appendChild(grp('Openings',[tDoor]));left.appendChild(grp('Blackout',[bkBtn]));
 // the snap switches were more in the way than helpful: walls keep their angle snap, the 1 ft grid is off, and neither is shown
 park.appendChild(sa);park.appendChild(sg);g('snapang').checked=true;g('snapgrid').checked=false;
 var view=grp('View',[tw]);view.classList.add('nf-view');left.appendChild(view);
 function viewVis(){view.style.display=tw&&getComputedStyle(tw).display!=='none'?'':'none'}viewVis();if(tw)new MutationObserver(viewVis).observe(tw,{attributes:true,attributeFilter:['style','class','hidden']});
 // rebuild the right panel
 var use=g('a-use'),rs=g('rs-sq').closest('.row'),rsHelp=rs.nextElementSibling,rows=['a-out','a-blk','a-n','a-doors','a-clr'].map(function(id){return g(id).closest('.row')}),insp=g('insp');
 [].slice.call(right.children).forEach(function(c){park.appendChild(c)});
 var card=el('div','nf-card');card.appendChild(el('div','nf-h2','This space'));var big=el('div','nf-big');big.appendChild(use);card.appendChild(big);card.appendChild(el('div','nf-sub','usable floor'));
 rs.classList.add('nf-rs');card.appendChild(rs);if(rsHelp&&/Scales/.test(rsHelp.textContent))park.appendChild(rsHelp);
 var more=el('div','nf-more');rows.forEach(function(r){more.appendChild(r)});card.appendChild(more);
 right.appendChild(card);
 var ctx=el('div','nf-ctx'),ctxH=el('div','nf-h2',''),ctxP=el('p','nf-p','');ctx.appendChild(ctxH);ctx.appendChild(ctxP);
 var bkSeg=el('div','nf-seg');bks.forEach(function(b){var t=b.dataset.t,lab={box:'Box',column:'Column',circle:'Circle',free:'Freeform',fill:'Fill room'}[t]||t;b.textContent=lab;bkSeg.appendChild(b)});
 ctx.appendChild(bkSeg);ctx.appendChild(copt);ctx.appendChild(dopt);ctx.appendChild(insp);if(tips){tips.classList.add('nf-tips');ctx.appendChild(tips)}
 right.appendChild(ctx);
 var TXT={draw:['Outline','Tap to place each corner of the building; tap the first corner again to close it. Esc cancels.'],iwall:['Interior wall','Click to place each corner; drag to move around the plan. The wall finishes when it reaches another wall or closes a room, or press Enter.'],door:['Door','Pick the type and width, then tap a wall to place it. Its clear area is kept free automatically.'],blk:['Blackout','Space you can\'t use: columns, stairs, areas that aren\'t part of the unit. Pick a shape and draw it on the plan, or pick Fill room and click inside a closed room to mark all of it.']};
 function sync(){var on=document.querySelector('.tool.on[data-t]'),t=on?on.dataset.t:'select',isBk=bks.some(function(b){return b.classList.contains('on')}),k=isBk?'blk':t;
  bkBtn.classList.toggle('on',isBk);
  // something picked on the plan (a door just placed or tapped, a wall...) shows its details, whatever tool is on
  var hasSel=insp.textContent.trim()!==''&&!/Nothing selected/.test(insp.textContent),idle=k==='select'&&!hasSel;
  more.style.display=idle?'':'none';if(tips)tips.style.display=idle?'':'none';
  insp.style.display=(k==='select'||hasSel)?'':'none';
  bkSeg.style.display=isBk&&!hasSel?'':'none';
  dopt.style.display=k==='door'&&!hasSel?'flex':'none';copt.style.display=t==='column'&&!hasSel?'flex':'none';
  if(hasSel){ctxH.style.display='';ctxH.textContent='Selected';ctxP.style.display='none'}
  else if(k==='select'){ctxH.style.display='none';ctxP.style.display='none'}
  else{ctxH.style.display='';ctxH.textContent=TXT[k][0];ctxP.textContent=TXT[k][1];ctxP.style.display=''}}
 // an imported plan (one with the floor plan attached) is reshaped by editing its walls, not redrawn, so the Outline tool is hidden there
 var vp=g('viewplan');function outlineTool(){var imp=!!(vp&&vp.style.display!=='none');tDraw.style.display=imp?'none':'';if(imp&&tDraw.classList.contains('on'))tSel.click()}
 if(vp)new MutationObserver(outlineTool).observe(vp,{attributes:true,attributeFilter:['style']});outlineTool();
 new MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class'],childList:false});
 new MutationObserver(sync).observe(insp,{childList:true,subtree:true,characterData:true});
 sync();
})();
// "+ New" in the editor's header starts the flow
var hdr=document.getElementById('create');if(hdr){var nb=document.createElement('button');nb.className='btn nf-new';nb.id='nf-newbtn';nb.textContent='+ New';nb.onclick=openStart;hdr.parentNode.insertBefore(nb,hdr)}

// create from scratch: straight into the editor with its plain rectangle
$('#nf-c-scratch').onclick=function(){hideAll();var w=document.getElementById('w0');if(w)setTimeout(function(){w.focus();w.select()},50)};

// ---- upload step ----
var drop=$('#nf-drop'),fin=$('#nf-in'),picked=null,MAX=20*1024*1024;
function kb(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function uerr(t){var e=$('#nf-uerr');e.textContent=t;e.classList.toggle('show',!!t)}
function clearFile(){picked=null;fin.value='';$('#nf-file').classList.remove('show');drop.style.display='';$('#nf-go').disabled=true;uerr('');var th=$('#nf-th');if(th.dataset.url){URL.revokeObjectURL(th.dataset.url);th.dataset.url=''}th.style.backgroundImage='';th.textContent=''}
function take(f){uerr('');if(!f)return;
 var n=(f.name||'').toLowerCase(),ok=/\.(pdf|png|jpe?g)$/.test(n)||/^(application\/pdf|image\/(png|jpeg))$/.test(f.type);
 if(!ok)return uerr('That file type isn\'t supported. Use a PDF, PNG or JPG.');
 if(f.size>MAX)return uerr('That file is '+kb(f.size)+'. The limit is 20 MB.');
 if(!f.size)return uerr('That file is empty.');
 picked=f;var th=$('#nf-th');th.style.backgroundImage='';th.textContent='';
 if(/^image\//.test(f.type)||/\.(png|jpe?g)$/.test(n)){var u=URL.createObjectURL(f);th.dataset.url=u;th.style.backgroundImage='url("'+u+'")'}else th.textContent='PDF';
 $('#nf-fn').textContent=f.name;$('#nf-fs').textContent=kb(f.size);drop.style.display='none';$('#nf-file').classList.add('show');$('#nf-go').disabled=false;$('#nf-go').focus()}
$('#nf-c-plan').onclick=function(){clearFile();show(up);setTimeout(function(){drop.focus()},30)};
$('#nf-up-back').onclick=openStart;
drop.onclick=function(){fin.click()};
drop.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fin.click()}});
$('#nf-browse').onclick=function(e){e.stopPropagation();fin.click()};
fin.onchange=function(){take(fin.files[0])};
$('#nf-fx').onclick=function(){clearFile();drop.focus()};
['dragenter','dragover'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove('over')})});
drop.addEventListener('drop',function(e){take(e.dataTransfer&&e.dataTransfer.files[0])});
up.addEventListener('dragover',function(e){e.preventDefault()});up.addEventListener('drop',function(e){e.preventDefault();if(!drop.contains(e.target)&&e.dataTransfer)take(e.dataTransfer.files[0])});
$('#nf-go').onclick=function(){if(picked)build(picked)};

// ---- loading screen ----
var STEPS=[{t:'Opening the file',s:3},{t:'Finding the floor plan on the page',s:12},{t:'Reading the walls',x:'two reads, best one kept',s:30},{t:'Finding doors and checking the walls',s:28},{t:'Checking against the drawing',s:4},{t:'Building your layout',s:2}];
var TOT=STEPS.reduce(function(a,b){return a+b.s},0),cur=0,stepT=0,t0=0,tick=0,skip1=false,running=false,page=null;
function drawSteps(state){$('#nf-steps').innerHTML=STEPS.map(function(s,i){var c=i<cur||state==='done'?'ok':(i===cur&&state!=='fail'?'now':'');if(i===1&&skip1)c+=' skip';return '<li class="'+c+'"><span class="dot"></span><span>'+s.t+(s.x?' <small>('+s.x+')</small>':'')+'</span></li>'}).join('')}
function progress(){var done=0;for(var i=0;i<cur;i++)done+=STEPS[i].s;var inStep=Math.min(.92,(Date.now()-stepT)/1000/STEPS[Math.min(cur,STEPS.length-1)].s);var p=cur>=STEPS.length?1:(done+inStep*STEPS[cur].s)/TOT;$('#nf-p').style.width=Math.round(p*100)+'%';$('#nf-t').textContent=Math.round((Date.now()-t0)/1000)+' s'}
function setStep(i){if(i<=cur&&cur)return;cur=i;stepT=Date.now();drawSteps('run');progress()}
// thumbnail: the whole page first, then zoom onto the plan once Claude has found it
function showPage(C){var box=$('#nf-thumb'),BW=box.clientWidth,BH=box.clientHeight,k=Math.min(BW/C.width,BH/C.height),R=3,cv=document.createElement('canvas');
 cv.width=Math.round(C.width*k*R);cv.height=Math.round(C.height*k*R);cv.getContext('2d').drawImage(C,0,0,cv.width,cv.height);cv.className='pg';cv.style.width=(C.width*k)+'px';cv.style.height=(C.height*k)+'px';
 var ox=(BW-C.width*k)/2,oy=(BH-C.height*k)/2;cv.style.transform='translate('+ox+'px,'+oy+'px)';box.querySelectorAll('.pg').forEach(function(x){x.remove()});$('#nf-ph').style.display='none';box.appendChild(cv);page={cv:cv,k:k,W:C.width,H:C.height,BW:BW,BH:BH}}
function zoomTo(c){if(!page||!c||c.w>=page.W&&c.h>=page.H)return;var s=Math.min(page.BW/(c.w*page.k),page.BH/(c.h*page.k)),cx=(c.x+c.w/2)*page.k,cy=(c.y+c.h/2)*page.k;
 var tx=page.BW/2-cx*s,ty=page.BH/2-cy*s;page.cv.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')'}
window.__plProgress=function(k,v){if(!running)return;
 if(k==='opened'){showPage(v.C);setStep(1);if(!document.getElementById('ai-zoom')||!document.getElementById('ai-zoom').checked){skip1=true;setStep(2)}}
 else if(k==='step'){setStep(v)}
 else if(k==='crop'){zoomTo(v)}};
function lerr(t){var e=$('#nf-lerr');e.textContent=t;e.classList.toggle('show',!!t)}
async function build(f){var card=$('#nf-card');card.classList.remove('done','fail');lerr('');$('#nf-again').style.display='none';$('#nf-cancel').style.display='';$('#nf-cancel').textContent='Cancel';
 $('#nf-ls').textContent=f.name+' · usually about a minute';$('#nf-lt').textContent='Building your layout';
 var box=$('#nf-thumb');box.querySelectorAll('.pg').forEach(function(x){x.remove()});$('#nf-ph').style.display='';page=null;skip1=false;
 cur=0;stepT=t0=Date.now();drawSteps('run');show(ld);running=true;clearInterval(tick);tick=setInterval(progress,250);progress();
 var ok=false;try{ok=await window.__cave.read(f)}catch(e){ok=false}
 running=false;clearInterval(tick);
 if(cancelled){cancelled=false;show(up);return}
 if(ok){cur=STEPS.length;drawSteps('done');progress();card.classList.add('done');$('#nf-cancel').style.display='none';setTimeout(function(){if(card.classList.contains('done'))hideAll()},1100)}
 else{card.classList.add('fail');drawSteps('fail');$('#nf-lt').textContent='That didn\'t work';var msg=(window.__cave.status()||'').split('\n')[0].replace(/\s*Copy Claude.*$/,'');lerr(msg||'The plan couldn\'t be read. Try again, or try another file.');$('#nf-again').style.display='';$('#nf-cancel').textContent='Close'}}
var cancelled=false;$('#nf-cancel').onclick=function(){if(running){cancelled=true;window.__cave.cancel();return}hideAll()};
$('#nf-again').onclick=function(){clearFile();show(up)};

// a new layout always starts here
setTimeout(openStart,300);
})();
</script>
