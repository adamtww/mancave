# One-off, manual: copy named layouts from the TEST database into the LIVE database,
# owned by a chosen live user. Only adds new layouts (plus one history entry each);
# never changes or deletes anything already in live.
# Run with apply=false first: it only lists what it would copy.
name: Copy layouts test → live

on:
  workflow_dispatch:
    inputs:
      names:
        description: "Layout names in TEST to copy, separated by |"
        required: true
      test_owner:
        description: "Username that owns them in TEST"
        required: true
      live_owner:
        description: "Live username to own the copies"
        required: true
      apply:
        description: "Actually write to live (false = dry run)"
        type: boolean
        default: false

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NAMES: ${{ inputs.names }}
      TEST_OWNER: ${{ inputs.test_owner }}
      LIVE_OWNER: ${{ inputs.live_owner }}
      APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler@4
      - name: Copy
        run: |
          cat > copy.mjs <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const q = (db, sql) => JSON.parse(execFileSync('wrangler', ['d1', 'execute', db, '--remote', '--json', '--command', sql], { maxBuffer: 1 << 28 }).toString())[0].results;
          const s = (v) => "'" + String(v).replace(/'/g, "''") + "'";
          const names = process.env.NAMES.split('|').map((x) => x.trim()).filter(Boolean);
          const live = q('mancave-db', `SELECT id, username FROM users WHERE username = ${s(process.env.LIVE_OWNER)}`);
          if (!live.length) { console.log('Live users:', q('mancave-db', 'SELECT username FROM users').map((u) => u.username).join(', ')); throw new Error('No live user ' + process.env.LIVE_OWNER); }
          const owner = live[0].id;
          const rows = q('mancave-db-test', `SELECT l.id, l.name, l.data, l.updated_at FROM layouts l JOIN users u ON u.id = l.owner_id WHERE u.username = ${s(process.env.TEST_OWNER)} AND l.name IN (${names.map(s).join(',')})`);
          console.log(`Test layouts by ${process.env.TEST_OWNER} matching:`, rows.map((r) => `#${r.id} "${r.name}" (${JSON.parse(r.data).items.length} items, saved ${r.updated_at})`));
          const missing = names.filter((n) => !rows.some((r) => r.name === n));
          if (missing.length) { console.log('All test layouts:', q('mancave-db-test', 'SELECT l.name, u.username FROM layouts l JOIN users u ON u.id = l.owner_id').map((r) => `"${r.name}" by ${r.username}`)); throw new Error('Not found in test: ' + missing.join(', ')); }
          const already = q('mancave-db', `SELECT name FROM layouts WHERE owner_id = ${owner} AND name IN (${names.map(s).join(',')})`);
          if (already.length) throw new Error('Live user already has: ' + already.map((r) => r.name).join(', ') + ' — not copying again');
          let sql = '';
          for (const r of rows) {
            sql += `INSERT INTO layouts (owner_id, name, data) VALUES (${owner}, ${s(r.name)}, ${s(r.data)});\n`;
            sql += `INSERT INTO versions (layout_id, user_id, name, data) SELECT MAX(id), ${owner}, ${s(r.name)}, ${s(r.data)} FROM layouts WHERE owner_id = ${owner} AND name = ${s(r.name)};\n`;
          }
          writeFileSync('copy.sql', sql);
          if (process.env.APPLY !== 'true') { console.log(`DRY RUN: would add ${rows.length} layouts for live user ${process.env.LIVE_OWNER} (#${owner}).`); process.exit(0); }
          execFileSync('wrangler', ['d1', 'execute', 'mancave-db', '--remote', '--file', 'copy.sql'], { stdio: 'inherit' });
          console.log('Now in live:', q('mancave-db', `SELECT id, name, updated_at FROM layouts WHERE owner_id = ${owner}`));
          EOF
          node copy.mjs
