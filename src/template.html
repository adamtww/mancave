<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>The Cave — Build Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ef;--paper:#fbfaf7;--line:#dedbd3;--ink:#2b2a27;--muted:#8a867c;--wall:#3a3935;--accent:#2f6fed;--bad:#d64545}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:13px}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:48px 1fr 30px;height:100vh}

.top{display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--paper);border-bottom:1px solid var(--line)}
.title{font-weight:600;margin-right:10px}

.lot{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}

.mid{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:0}
.mid>.hist{position:static!important;grid-column:1/-1;grid-row:1;padding:10px 12px;background:var(--paper);border-bottom:1px solid var(--line);z-index:auto}
.mid>.stage{grid-column:1;grid-row:2}
.mid>.info{position:absolute;grid-column:auto;grid-row:auto}
/* the object list only lives in the Add Objects panel now */
/* top toolbar retired for now */
.app>.top{display:none!important}
.app,body.touch .app{grid-template-rows:1fr auto!important}
.undobar{position:absolute;top:6px;left:16px;display:flex;gap:8px;z-index:5;align-items:flex-end}
.ucol{display:flex;flex-direction:column;align-items:center;gap:4px}
.ulbl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#9a958a;line-height:1;white-space:nowrap;user-select:none;-webkit-user-select:none}
.mcol{margin-left:8px;align-items:stretch}
.mcol .rotog{margin-left:0}
.mlbl{display:flex;align-items:center;gap:8px;padding:0 14px}
.mlbl i{flex:1;height:6px;border-top:1.5px solid #cfcabe;margin-top:5px}
.mlbl i:first-child{border-left:1.5px solid #cfcabe;border-top-left-radius:4px}
.mlbl i:last-child{border-right:1.5px solid #cfcabe;border-top-right-radius:4px}
body.furn .undobar{display:none!important}
.rotog{position:relative;display:inline-grid;grid-template-columns:1fr 1fr 1fr;margin-left:16px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.06);align-self:center}
.rotog button{position:relative;z-index:1;border:0;background:none;border-radius:999px;padding:6px 13px;font-size:14px;color:#6b675e;cursor:pointer;transition:color .18s;white-space:nowrap}
.rotog button.on{color:#fff;font-weight:600}
.rotog button::after{content:attr(data-l);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:600}
.rotog .rothumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:999px;background:var(--accent);box-shadow:0 1px 4px rgba(47,111,237,.35);transition:transform .2s ease}
.rotog.obj .rothumb{transform:translateX(100%)}
.rotog.sum .rothumb{transform:translateX(200%)}
body.touch .rotog button{padding:8px 12px;font-size:15px}
.undobar.tight .hb>span{display:none}
.undobar.tight .hb{padding-left:12px!important;padding-right:12px!important}
.hist .artseg{display:none!important}
body.art-on .hist .artseg{display:inline-flex!important}
.hist .artseg{position:static;transform:none;margin-left:22px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.06);align-self:stretch}
.hist .artseg button{padding:10px 16px;font-size:14px}
#drawer,#dexp,#dcol{display:none!important}
.hist{left:12px!important}
.drawer{width:270px;overflow-y:auto;overflow-x:hidden;background:var(--paper);border-right:1px solid var(--line)}
.drawer .in{width:100%}
.drawer .s{padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
.drawer .s input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
.cat>summary{list-style:none;cursor:pointer;padding:8px 12px;font-weight:500;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eeebe4}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .n{margin-left:auto;color:var(--muted);font-size:11px;font-weight:400}
.dot{width:7px;height:7px;border-radius:50%;opacity:.7}
.pi{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 12px 6px 27px;cursor:grab;font-size:12.5px}
.pi:hover{background:#efede7}
.pi.on{background:#e7eefc;color:var(--accent)}
.pi{user-select:none;-webkit-user-select:none}
.det{position:absolute;left:14px;top:14px;width:270px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:12px 14px;display:none;z-index:5}
.det.show{display:block}
.det .x{position:absolute;right:8px;top:6px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
.det .h{font-size:11px;color:var(--muted)}
.det .nm{font-weight:600;font-size:14px;margin:2px 0 10px;padding-right:16px}
.det .tile{display:flex;align-items:center;justify-content:center;background:#efece5;border:1px solid #c9c4b8;border-radius:6px;margin:4px auto 10px;cursor:grab;color:#6b675e;font-size:11px;text-align:center;padding:4px;user-select:none}
.det .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid #f1efea}
.det .kv span:first-child{color:var(--muted)}
.det .note{font-size:11.5px;color:#6b675e;line-height:1.45;margin-top:8px}
.det .warn{font-size:11.5px;line-height:1.45;margin-top:8px;padding:7px 9px;background:#fbf6ea;border-left:2px solid #d9a634;border-radius:4px;color:#5b4a1f}
.det .tip{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
.chip{position:fixed;z-index:50;pointer-events:none;background:#fff;border:1px solid #c9c4b8;border-radius:8px;padding:7px 10px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:12px;transform:translate(-50%,-60%) rotate(-3deg) scale(1.03);transition:transform .08s;white-space:nowrap}
.chip b{font-weight:600}.chip span{color:var(--muted);margin-left:6px}
body.dragging,body.dragging *{cursor:grabbing!important}
.pi span:last-child{color:var(--muted);white-space:nowrap;font-size:11.5px}
.stage{position:relative;overflow:hidden;min-height:0;touch-action:none}
#svg{position:absolute;inset:0;width:100%;height:100%}
.stage.build{cursor:crosshair}
svg{display:block;user-select:none;touch-action:none}
.status{display:flex;gap:18px;align-items:center;padding:0 14px;background:var(--paper);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.status b{color:var(--ink);font-weight:500}
.insp{position:absolute;right:14px;top:14px;width:250px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:12px;display:none}
.insp.show{display:block}
.insp .h{font-size:11px;color:var(--muted);margin-bottom:6px}
.insp input{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.insp .row{display:flex;gap:6px;margin-top:8px}
.insp label{flex:1;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.insp .note{font-size:11.5px;color:#6b675e;margin-top:8px;line-height:1.45}
.insp .btns{display:flex;gap:6px;margin-top:10px}
.insp .btns button{flex:1;border:1px solid var(--line);background:#faf9f6;border-radius:6px;padding:5px;cursor:pointer;font-size:12px}
.insp .btns button:hover{background:#f0eee8}
.hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;line-height:1.6}
.hint b{color:var(--ink);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 10px;font-size:12px;color:#6b675e;cursor:pointer}
.seg button.on{background:#e7eefc;color:var(--accent)}
.tonly{display:none}
.pi.lift{background:#e7eefc}

body.touch .tonly{display:flex}
body.touch span.tonly{display:block}
body.touch .app{grid-template-rows:56px 1fr 34px;height:100dvh}

body.touch .cat>summary{padding:13px 14px;font-size:15px}

body.touch .insp::before,body.touch .det::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#d6d2c8;margin:-8px auto 10px}
body.touch .insp input{padding:9px;font-size:15px}
body.touch .insp .btns button{padding:11px;font-size:14px}
body.touch .insp label{font-size:12.5px}

body.touch .det .kv{font-size:14px;padding:6px 0}

body{touch-action:manipulation}
.tool{white-space:nowrap}.S{display:none}
@media (max-width:900px){body.touch .top{flex-wrap:wrap;height:auto;padding:4px 8px;row-gap:2px;overflow:visible}body.touch .app{grid-template-rows:auto 1fr auto}body.touch .grow{display:none}body.touch .tool{padding:10px 9px}body.touch .sep{margin:0 2px}body.touch .lot input{width:56px;padding:7px 4px;text-align:center}}

.insp .btns button:disabled{opacity:.4;cursor:default}
.insp input:disabled{background:#f4f3ef;color:#9a968c}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.swc{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0;font-size:12px;color:#9a968c;display:flex;align-items:center;justify-content:center;position:relative}
.swc.on{outline:2px solid var(--accent);outline-offset:2px}
.insp label.swc{flex:none;width:24px;height:24px;flex-direction:row;gap:0}

.insp .btns button{white-space:nowrap}
.swx{background:conic-gradient(#e07a5f,#e9c46a,#8ab17d,#2a9d8f,#5b8bd9,#8e7cc3,#d47fa6,#e07a5f);color:#fff;font-weight:600}
.swx input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
body.touch .swc{width:34px;height:34px}
.pw{margin-top:10px;padding:8px 10px;background:#f7f6f2;border:1px solid #ebe8e1;border-radius:8px}
.pwh{font-size:11px;color:var(--muted);margin-bottom:4px}
.pwr{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0}
.pwr b{font-weight:600}
body.touch .pwr{font-size:14px;padding:4px 0}
.flash{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2b2a27;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.det .tile.art{background:#fbfaf7;border:1px solid #9d988c;padding:0;margin-bottom:4px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.det .tile.art:hover{box-shadow:0 4px 12px rgba(0,0,0,.12)}
.det .tcap{text-align:center;font-size:10.5px;color:var(--muted);margin-bottom:10px}
.top{position:relative}
.artseg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
@media (max-width:1100px){.artseg{position:static;transform:none}}
.seg,.lot,.tool{flex:none}
body.touch .status{padding-bottom:max(14px,env(safe-area-inset-bottom));height:auto;min-height:34px}
body.touch .app{grid-template-rows:56px 1fr auto}
@media (max-width:900px){body.touch .seg button{padding:9px 9px}body.touch .lot{gap:2px}body.touch .lot input{width:52px;padding:7px 2px;-moz-appearance:textfield;appearance:textfield}body.touch .lot input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}body.touch .lot .L,body.touch .lot{font-size:12px}body.touch .top{gap:2px}}
@media (max-width:900px){body.touch .app{grid-template-rows:auto 1fr auto}body.touch .top{min-height:56px}}
.dtitle{font-weight:600;font-size:15px;margin:2px 2px 8px}
body.touch .dtitle{font-size:17px}
.hist{position:absolute;left:12px;top:10px;display:flex;gap:8px;z-index:4}
.hb{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 12px;font-size:14px;color:#3d3b36;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:background .12s,box-shadow .12s}

.dtitle{display:flex;align-items:center;justify-content:space-between}

.mid{position:relative}

.lbox{width:min(360px,90vw);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(40,36,28,.12);padding:28px 26px 22px;display:flex;flex-direction:column;gap:12px}

.mrow .ma{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.mform{display:flex;flex-direction:column;gap:10px}

.mform .mfb{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.mform .merr{min-height:16px;font-size:13px;color:#b3412f}

.ubar{margin:14px 0 4px}
.ubar .ul{display:flex;justify-content:space-between;font-size:14px;color:#2b2a27}

.ubar.mid .ut i{background:#e0a82e}.ubar.hi .ut i{background:#d64545}
.unote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.45}
/* Object Library card, right of Info */
.mid>.lib{position:absolute;width:clamp(300px,24vw,420px);bottom:16px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(40,36,28,.10),0 2px 6px rgba(40,36,28,.05);z-index:4;display:flex;flex-direction:column;overflow:hidden}
body.furn .lib{display:none!important}
/* mode panes: Object Library and Edit Rooms share one slot and flip like a card */
:root{--pane-t:.5s}
.mid>.lib{transform:perspective(1400px) rotateY(0deg);transform-origin:50% 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform calc(var(--pane-t)/2) cubic-bezier(.2,.7,.3,1) calc(var(--pane-t)/2),opacity 0s linear calc(var(--pane-t)/2),visibility 0s linear calc(var(--pane-t)/2)}
.mid>.lib.away{transform:perspective(1400px) rotateY(90deg);opacity:0;visibility:hidden;pointer-events:none;transition:transform calc(var(--pane-t)/2) cubic-bezier(.6,0,.8,.4),opacity 0s linear calc(var(--pane-t)/2),visibility 0s linear calc(var(--pane-t)/2)}
.mid>.lib.in.pre{transform:perspective(1400px) rotateY(-90deg);transition:none}
body.noanim .mid>.lib{transition:none!important}
/* no text selection / long-press callout on the app chrome and canvas (iPad long-press was selecting labels) */
html,body,.app,#stage,#svg,#svg *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#svg .popin{transform-box:fill-box;transform-origin:center;animation:popin .34s cubic-bezier(.2,.9,.3,1.25)}
@keyframes popin{0%{transform:scale(.82);opacity:.35}100%{transform:scale(1);opacity:1}}
#svg .empv.fresh{animation:empv .18s ease-out}@keyframes empv{from{opacity:0}to{opacity:1}}
/* Rooms mode: objects are faded and can't be touched (taps fall through to the room) */
#svg .ob{transition:opacity .25s}
body.mode-rooms:not(.furn) #svg .ob{opacity:.4;pointer-events:none}
body.mode-rooms #rmenu,body.mode-rooms #cmenu{display:none!important}
/* Objects mode: rooms are faded and can't be touched */
#svg g.o:not(.ob){transition:opacity .25s}
body.mode-objects:not(.furn) #svg g.o:not(.ob){opacity:.6;pointer-events:none}

  /* this browser's pre-account plan moves into the first account that signs in here, once */
  if(!migrated&&S.items.length){try{localStorage.setItem('cave-migrated','1')}catch(_){}return createLayout('My Warehouse',localData,null,'Moved your plan from this browser into your account')}
  try{localStorage.setItem('cave-migrated','1')}catch(_){}
  if(lyCache.length)return openLayout(lyCache[0].id).then(function(){flash('Showing '+lyCache[0].owner+"'s layout — Save to make your own copy")});
  return createLayout('My Warehouse',{lot:{w:100,d:100},items:[],defs:{}},null,'Welcome! Your layouts are saved to your account.')})}
function openLayout(id,o){o=o||{};return api('GET','/api/layouts/'+id).then(function(j){var l=j.layout,key=JSON.stringify({lot:l.data.lot,items:l.data.items});
  applyData(l.data,l.name);setCur(l,packKey());
  if(o.restoreLocal&&o.restoreLocal!==savedJSON&&o.localData){applyData(o.localData,l.name);cloudUI();flash('Restored your unsaved changes')}
  closeModal();render()})}

  S.name=j.layout.name;setCur(j.layout,packKey());render();flash(msg||'Saved');return j.layout}).catch(function(e){cloudBusy=false;cloudUI();flash(e.message);throw e})}

 if(!cur)return createLayout('My Warehouse',data);
 if(!cur.mine)return createLayout(cur.name.replace(/ \([^)]*'s copy\)$/,'')+' ('+me.username+"'s copy)",data,cur.id,'Saved as your own copy');
 cloudBusy=true;cloudUI();return api('PUT','/api/layouts/'+cur.id,{name:cur.name,data:data}).then(function(){cloudBusy=false;savedJSON=packKey();cloudUI();flash('Saved')})

/* ---- Layouts browser ---- */

function bindLy(){$('#mdl-b').onclick=function(e){var t=e.target.closest('[data-tab]');if(t){lyTab=t.dataset.tab;renderLayouts()}}}
function renderLive(head){
 var note='<div class="ms" style="font-size:12.5px;color:var(--muted);margin-bottom:6px">Your real layouts from the live site. This is <b>read-only</b>: copying makes a new layout in the <b>test</b> database and never changes live.</div>';
 if(!liveTok){$('#mdl-b').innerHTML=head+note+'<form class="mrowform" id="lv-f"><input id="lv-u" placeholder="Live username" autocapitalize="none" value="'+escH(me?me.username:'')+'"><input id="lv-p" type="password" placeholder="Live password"><button class="mbtn pri" type="submit">Sign in to live</button></form><div class="merr" id="lv-e" style="font-size:13px;color:#b3412f;min-height:16px"></div>';
  bindLy();$('#lv-f').onsubmit=function(e){e.preventDefault();liveLogin($('#lv-u').value.trim(),$('#lv-p').value).then(function(){renderLayouts()}).catch(function(err){$('#lv-e').textContent=err.message})};return}
 liveGet('/api/layouts').then(function(j){var list=j.layouts,h=head+note;
  if(list.length)h+='<div style="display:flex;justify-content:flex-end;margin:4px 0 2px"><button class="mbtn" data-k="liveall">Copy all '+list.length+' to test</button></div>';else h+='<div class="mempty">No live layouts yet.</div>';
  list.forEach(function(l){h+='<div class="mrow" data-id="'+l.id+'"><div class="mi"><div class="mn">'+escH(l.name)+'</div><div class="ms">by <b>'+escH(l.owner)+'</b> · saved '+ago(l.updated_at)+'</div></div><div class="ma"><button class="mbtn pri" data-k="livecopy">Copy to test</button></div></div>'});
  $('#mdl-b').innerHTML=h;
  $('#mdl-b').onclick=function(e){var t=e.target.closest('[data-tab]');if(t){lyTab=t.dataset.tab;renderLayouts();return}var k=e.target.closest('[data-k]');if(!k)return;
   var copyOne=function(l){return liveGet('/api/layouts/'+l.id).then(function(x){return api('POST','/api/layouts',{name:x.layout.name+' (from live · '+x.layout.owner+')',data:x.layout.data})})};
   if(k.dataset.k==='livecopy'){var id=+k.closest('.mrow').dataset.id,l=list.find(function(x){return x.id===id});k.disabled=true;k.textContent='Copying…';
    guard(function(){copyOne(l).then(function(r){return openLayout(r.layout.id)}).then(function(){flash('Copied “'+l.name+'” into the test site')}).catch(function(err){flash(err.message);k.disabled=false;k.textContent='Copy to test'})})}
   if(k.dataset.k==='liveall'){k.disabled=true;k.textContent='Copying…';var i=0,next=function(){if(i>=list.length){flash('Copied '+list.length+' live layouts into the test site');lyTab='mine';openLayouts();return}return copyOne(list[i++]).then(next)};next().catch(function(err){flash(err.message);k.disabled=false;k.textContent='Copy all to test'})}}
 }).catch(function(err){$('#mdl-b').innerHTML=head+note+'<div class="mempty">'+escH(err.message)+'</div>';bindLy()})}
function renderLayouts(){var mine=lyCache.filter(function(l){return l.owner_id===me.id}),oth=lyCache.filter(function(l){return l.owner_id!==me.id}),list=lyTab==='mine'?mine:oth;
 var h='<div class="mtabs"><button data-tab="mine" class="'+(lyTab==='mine'?'on':'')+'">My layouts ('+mine.length+')</button><button data-tab="shared" class="'+(lyTab==='shared'?'on':'')+'">Everyone else ('+oth.length+')</button>'+(TEST_SITE?'<button data-tab="live" class="'+(lyTab==='live'?'on':'')+'">Live (read-only)</button>':'')+'<span class="sp"></span><button data-k="new" class="mbtn pri">+ New layout</button></div>';
 if(lyTab==='live'){$('#mdl-b').innerHTML=h+'<div class="mempty">Loading live layouts…</div>';bindLy();renderLive(h);return}
 if(!list.length)h+='<div class="mempty">'+(lyTab==='mine'?'You have no layouts yet.':'Nobody else has saved a layout yet.')+'</div>';
 list.forEach(function(l){var open=cur&&cur.id===l.id;
  h+='<div class="mrow" data-id="'+l.id+'"><div class="mi"><div class="mn">'+escH(l.name)+(open?'<em>open</em>':'')+'</div><div class="ms">'+(lyTab==='mine'?'':'by <b>'+escH(l.owner)+'</b> · ')+'saved '+ago(l.updated_at)+(l.based_on_name?' · based on “'+escH(l.based_on_name)+'”'+(l.based_on_owner?' by '+escH(l.based_on_owner):''):'')+'</div></div><div class="ma">';
  h+=(open?'':'<button class="mbtn pri" data-k="open">Open</button>')+'<button class="mbtn" data-k="hist">History</button>';
  if(lyTab==='mine')h+='<button class="mbtn" data-k="ren">Rename</button><button class="mbtn" data-k="dup">Duplicate</button><button class="mbtn red" data-k="del">Delete</button>';
  else h+='<button class="mbtn" data-k="copy">Make my copy</button>';
  h+='</div></div>'});
 $('#mdl-b').innerHTML=h;
 $('#mdl-b').onclick=function(e){var t=e.target.closest('[data-tab]');if(t){lyTab=t.dataset.tab;renderLayouts();return}var k=e.target.closest('[data-k]');if(!k)return;var row=k.closest('.mrow'),id=row?+row.dataset.id:0,l=lyCache.find(function(x){return x.id===id});
  switch(k.dataset.k){
   case 'new':guard(function(){inputM('New layout','Name','Untitled warehouse','Create',function(v,err){createLayout(v||'Untitled warehouse',{lot:{w:100,d:100},items:[],defs:{}},null,'Created').then(function(nl){return openLayout(nl.id)}).catch(function(e){err(e.message)})})});break;
   case 'open':guard(function(){openLayout(id).catch(function(e){flash(e.message)})});break;
   case 'hist':openHistory(l);break;
   case 'ren':inputM('Rename layout','Name',l.name,'Rename',function(v,err){api('PUT','/api/layouts/'+id,{name:v}).then(function(j){if(cur&&cur.id===id){cur.name=j.name;cloudUI();renderInfo()}openLayouts()}).catch(function(e){err(e.message)})});break;
   case 'dup':api('GET','/api/layouts/'+id).then(function(j){return api('POST','/api/layouts',{name:j.layout.name+' (copy)',data:j.layout.data,based_on:id})}).then(function(){flash('Duplicated');openLayouts()}).catch(function(e){flash(e.message)});break;
   case 'copy':api('GET','/api/layouts/'+id).then(function(j){return api('POST','/api/layouts',{name:j.layout.name+' ('+me.username+"'s copy)",data:j.layout.data,based_on:id})}).then(function(){flash('Copied to your layouts');lyTab='mine';openLayouts()}).catch(function(e){flash(e.message)});break;
   case 'del':askM('Delete layout','Delete <b>'+escH(l.name)+'</b> and its history? This can’t be undone. Copies other people made are not affected.','Delete',function(){api('DELETE','/api/layouts/'+id).then(function(){if(cur&&cur.id===id){cur=null;savedJSON=null;cloudUI()}flash('Deleted');openLayouts()}).catch(function(e){flash(e.message)})},true);break}}}
$('#ly-open').onclick=function(e){e.stopPropagation();openLayouts()};
/* ---- version history ---- */
function openHistory(l){modal('History — '+l.name,'<div class="mempty">Loading…</div>');api('GET','/api/layouts/'+l.id+'/versions').then(function(j){var h='<div class="ms" style="font-size:12.5px;color:var(--muted);margin-bottom:6px">Every save is kept (latest 50). Loading an old version puts it on the canvas — press Save to keep it.</div>';
  j.versions.forEach(function(v,i){h+='<div class="mrow" data-v="'+v.id+'"><div class="mi"><div class="mn">'+whenFull(v.created_at)+(i===0?'<em>latest</em>':'')+'</div><div class="ms">saved by '+escH(v.by||'?')+' · '+ago(v.created_at)+'</div></div><div class="ma"><button class="mbtn" data-k="load">Load</button></div></div>'});
  $('#mdl-b').innerHTML=h;$('#mdl-b').onclick=function(e){var k=e.target.closest('[data-k="load"]');if(!k)return;var vid=+k.closest('.mrow').dataset.v;
   guard(function(){var go=function(){return api('GET','/api/versions/'+vid).then(function(x){applyData(x.version.data,l.name);cloudUI();closeModal();flash('Loaded the '+whenFull(x.version.created_at)+' version — Save to keep it')})};
    (cur&&cur.id===l.id?go():openLayout(l.id).then(go)).catch(function(e){flash(e.message)})})}}).catch(function(e){$('#mdl-b').innerHTML='<div class="mempty">'+escH(e.message)+'</div>'})}
/* ---- account menu ---- */
$('#u-btn').onclick=function(e){e.stopPropagation();if(!me)return showLogin();$('#umenu').classList.toggle('show')};
document.addEventListener('pointerdown',function(e){if(!e.target.closest('.uwrap'))$('#umenu').classList.remove('show')});
$('#umenu').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;$('#umenu').classList.remove('show');var a=b.dataset.a;
 if(a==='out')guard(function(){api('POST','/api/logout').catch(function(){}).then(function(){signedOut('Signed out')})});
 if(a==='pw')openPw();if(a==='users')openUsers();if(a==='usage')openUsage()};

  $('#mdl-b').innerHTML=h;
  $('#nu-f').onsubmit=function(e){e.preventDefault();api('POST','/api/users',{username:$('#nu-u').value.trim(),password:$('#nu-p').value}).then(function(){flash('User added');openUsers()}).catch(function(err){$('#nu-e').textContent=err.message})};
  $('#mdl-b').onclick=function(e){var k=e.target.closest('[data-k]');if(!k)return;var row=k.closest('.mrow'),id=+row.dataset.id,n=row.dataset.n;
   if(k.dataset.k==='pw')inputM('Reset password for '+n,'New password','','Set password',function(v,err){api('PUT','/api/users/'+id,{password:v}).then(function(){flash('Password reset — '+n+' is signed out everywhere');openUsers()}).catch(function(e2){err(e2.message)})},'text');
   if(k.dataset.k==='rm')askM('Remove '+n,'Remove <b>'+escH(n)+'</b> and delete all of their layouts? This can’t be undone.','Remove user',function(){api('DELETE','/api/users/'+id).then(function(){flash('Removed '+n);openUsers()}).catch(function(e2){flash(e2.message)})},true)}}).catch(function(e){$('#mdl-b').innerHTML='<div class="mempty">'+escH(e.message)+'</div>'})}
/* ---- admin: usage ---- */
function fmtBytes(b){if(b==null)return '—';if(b<1e3)return b+' B';if(b<1e6)return (b/1e3).toFixed(1)+' KB';if(b<1e9)return (b/1e6).toFixed(1)+' MB';return +(b/1e9).toFixed(2)+' GB'}
function ubar(label,val,max,fmt){if(val==null)return '<div class="ubar"><div class="ul"><span>'+label+'</span><b>—</b></div><div class="ut"><i style="width:0"></i></div></div>';var pct=Math.min(100,val/max*100),cls=pct>=80?' hi':pct>=50?' mid':'';
 return '<div class="ubar'+cls+'"><div class="ul"><span>'+label+'</span><b>'+fmt(val)+' / '+fmt(max)+' · '+(pct<1&&val>0?'<1':Math.round(pct))+'%</b></div><div class="ut"><i style="width:'+Math.max(pct,val>0?1:0)+'%"></i></div></div>'}
function openUsage(){modal('Usage — Cloudflare free plan','<div class="mempty">Loading…</div>');api('GET','/api/usage').then(function(u){var n=function(x){return Math.round(x).toLocaleString('en-US')},L=u.limits,t=u.today||{};
  var ms=new Date(u.resetsAt)-Date.now(),hrs=Math.floor(ms/3600000),mins=Math.floor(ms%3600000/60000);
  var h=ubar('Database storage',u.storageBytes,L.storageBytes,fmtBytes)+ubar('Rows read today',t.rowsRead,L.rowsRead,n)+ubar('Rows written today',t.rowsWritten,L.rowsWritten,n)+ubar('Worker requests today',t.requests,L.requests,n);
  h+='<div class="unote">Daily counts reset in <b>'+hrs+' h '+mins+' min</b> (midnight UTC = '+new Date(u.resetsAt).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})+' your time). They cover your whole Cloudflare account and can lag a few minutes. '+(u.layouts!=null?u.layouts+' layouts saved.':'')+(u.note?'<br><b>Note:</b> '+escH(u.note):'')+'</div>';
  $('#mdl-b').innerHTML=h;$('#mdl-b').onclick=null}).catch(function(e){$('#mdl-b').innerHTML='<div class="mempty">'+escH(e.message)+'</div>'})}
cloudUI();cloudBoot();

})();
