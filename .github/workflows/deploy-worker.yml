# Deploys the backend (worker/) to Cloudflare whenever it changes.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# CLOUDFLARE_ANALYTICS_TOKEN, ADMIN_PASSWORD.
name: Deploy API

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

concurrency: deploy-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Find or create the database
        run: |
          find_id() {
            wrangler d1 list --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const a=JSON.parse(d);const x=a.find(z=>z.name==='mancave-db');process.stdout.write(x?x.uuid:'')})"
          }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            wrangler d1 create mancave-db
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then echo "Could not find or create the D1 database"; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          echo "Using database $ID"

      - name: Create or update tables
        run: wrangler d1 execute mancave-db --remote --file schema.sql

      - name: Deploy the Worker
        run: wrangler deploy

      - name: Set Worker secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          printf '%s' "$ADMIN_PASSWORD"        | wrangler secret put ADMIN_PASSWORD
          printf '%s' "$CF_ANALYTICS_TOKEN"    | wrangler secret put CF_ANALYTICS_TOKEN
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | wrangler secret put CF_ACCOUNT_ID

      - name: Check it is up
        run: |
          sleep 5
          curl -fsS https://mancave-api.adamtww.workers.dev/api/health && echo " — API is live"
