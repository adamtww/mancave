# Deploys the backend (worker/) to Cloudflare whenever it changes.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# CLOUDFLARE_ANALYTICS_TOKEN, ADMIN_PASSWORD.
name: Deploy API

on:
  push:
    branches: [main, test]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

concurrency: deploy-api-${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Pick live or test backend
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "WORKER_NAME=mancave-api" >> "$GITHUB_ENV"; echo "DB_NAME=mancave-db" >> "$GITHUB_ENV"
          else
            echo "WORKER_NAME=mancave-api-test" >> "$GITHUB_ENV"; echo "DB_NAME=mancave-db-test" >> "$GITHUB_ENV"
          fi
          W=$(grep WORKER_NAME "$GITHUB_ENV" | tail -1 | cut -d= -f2); D=$(grep DB_NAME "$GITHUB_ENV" | tail -1 | cut -d= -f2)
          sed -i "s/__WORKER_NAME__/$W/; s/__DB_NAME__/$D/" wrangler.toml
          cat wrangler.toml

      - name: Find or create the database
        run: |
          find_id() {
            wrangler d1 list --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const a=JSON.parse(d);const x=a.find(z=>z.name===process.env.DB_NAME);process.stdout.write(x?x.uuid:'')})"
          }
          wrangler d1 list || true
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            wrangler d1 create "$DB_NAME"
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then echo "Could not find or create the D1 database"; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          echo "Deploying $WORKER_NAME with database $DB_NAME ($ID)"

      - name: Create or update tables
        run: wrangler d1 execute "$DB_NAME" --remote --file schema.sql

      - name: Deploy the Worker
        run: wrangler deploy

      - name: Set Worker secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          printf '%s' "$ADMIN_PASSWORD"        | wrangler secret put ADMIN_PASSWORD
          printf '%s' "$CF_ANALYTICS_TOKEN"    | wrangler secret put CF_ANALYTICS_TOKEN
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | wrangler secret put CF_ACCOUNT_ID

      - name: Check it is up
        run: |
          sleep 5
          curl -fsS "https://$WORKER_NAME.adamtww.workers.dev/api/health" && echo " — $WORKER_NAME is live"
